# Runs everything:  docker compose up --build
# Then open http://localhost:8000
# Values come from .env (copy .env.example to .env first).
#
#   web     nginx: the website, and the only service the browser talks to
#   backend FastAPI, reached through web at /api and /auth
#   worker  the nightly job (same image as backend)
#   db      Postgres

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  APP_ORIGIN: ${APP_ORIGIN}
  COOKIE_SECURE: ${COOKIE_SECURE}
  SESSION_DAYS: ${SESSION_DAYS}
  OSM_CONTACT_EMAIL: ${OSM_CONTACT_EMAIL}
  PHOTON_URL: ${PHOTON_URL:-}
  OVERPASS_URL: ${OVERPASS_URL:-}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Keeps the data when the container is removed.
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Ready once Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-environment
    # No ports: the browser reaches the backend through web, so the
    # website and the API count as the same site.
    depends_on:
      # Wait until Postgres passes its healthcheck, not just until it starts.
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      # The backend runs the migrations when it starts.
      backend:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  db-data:
