# Serves the website and passes API calls to the backend, all on one origin
# (http://localhost:8000). Same origin means the session cookie and the
# backend's Origin check work with no extra setup.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api/me goes to the backend as /me. The trailing slash strips "/api".
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Filling 14 days of prayers can take about 20 seconds with real Google.
        proxy_read_timeout 120s;
    }

    # Sign-in stays at /auth/..., so Google's redirect URI doesn't change.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a hash in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anything else is the website. index.html is never cached, so a new
    # version shows up straight away.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
