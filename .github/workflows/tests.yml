# Runs the backend and website tests on every push and every pull request.
# No real keys are used anywhere: Google, Photon, MAWAQIT, and OpenRouteService are all faked.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A real Postgres for the tests, started before the steps below.
    # Throwaway test values only. This database is deleted when the job ends.
    services:
      postgres:
        image: postgres:17  # same version as docker-compose.yml
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test

    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # same as the Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"  # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Check types
        run: npm run typecheck

      # Only Chromium: both test projects (desktop and phone) use it.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The API is mocked inside each test, so no backend is needed.
      - name: Run tests
        run: npx playwright test

      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The server's setup. Catches a broken docker-compose.prod.yml or a typo
  # in a deploy script before it reaches the server. Nothing is started.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The template has placeholders only, which is all "config" needs.
      - name: Check the production Compose file
        run: docker compose --env-file deploy/production.env.example -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Check the deploy scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
