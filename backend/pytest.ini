[pytest]
# Look for tests in the tests folder, and let them import "app" from this folder.
testpaths = tests
pythonpath = .
# Every test must finish within 10 seconds. Tests only use fakes, so a hang
# means a real network call or a loop that never ends.
timeout = 10
markers =
    database: needs a running Postgres (added automatically in conftest.py)
    real_list: the app loads the real MAWAQIT list file when it starts (off for every other test)
    real_announcements: reads the real announced times in app/masjid_times/announced (off for every other test)
